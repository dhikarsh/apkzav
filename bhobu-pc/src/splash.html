<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff;
    background: radial-gradient(circle at 50% 35%, #1e6fe8 0%, #0a2a6e 55%, #061a45 100%);
  }
  .logo {
    width: 260px; padding: 18px 22px; border-radius: 28px; background: #fff;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35); animation: pop .6s ease-out both;
  }
  .logo img { width: 100%; display: block; }
  p { margin: 0; font-size: 15px; opacity: .85; letter-spacing: .3px; }
  .dots span {
    display: inline-block; width: 9px; height: 9px; margin: 0 4px; border-radius: 50%;
    background: #ff9a1f; animation: bounce 1s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .15s; background: #ffd166; }
  .dots span:nth-child(3) { animation-delay: .3s; background: #fff; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-10px); opacity: 1; } }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <div class="logo"><img src="../assets/logo.png" alt="BHOBU RELOAD"></div>
  <div class="dots"><span></span><span></span><span></span></div>
  <p>Menyiapkan BHOBU RELOAD…</p>
</body>
</html>
