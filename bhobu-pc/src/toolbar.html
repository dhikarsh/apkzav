<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>BHOBU RELOAD</title>
<style>
  :root {
    --navy: #0a2a6e;
    --blue: #1e6fe8;
    --orange: #ff9a1f;
    --green: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background: linear-gradient(100deg, #081f55 0%, var(--navy) 38%, #1450c4 100%);
    user-select: none;
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 14px;
    /* sisi kanan dibiarkan kosong untuk tombol minimize/maximize/close Windows */
    padding: 0 150px 0 14px;
    position: relative;
  }
  button, .brand { -webkit-app-region: no-drag; }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand img {
    width: 40px; height: 40px; border-radius: 12px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .28);
  }
  .brand b { display: block; font-size: 15px; letter-spacing: .4px; }
  .brand span { display: block; font-size: 11px; opacity: .75; }
  .sep { width: 1px; height: 30px; background: rgba(255, 255, 255, .18); }
  .group { display: flex; gap: 6px; }
  button {
    border: 0; cursor: pointer; color: #fff; font: inherit;
    height: 36px; min-width: 36px; padding: 0 10px; border-radius: 11px;
    background: rgba(255, 255, 255, .12);
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255, 255, 255, .22); }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: default; background: rgba(255, 255, 255, .08); }
  button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .title {
    flex: 1; min-width: 0; font-size: 13px; opacity: .8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .zoom { font-size: 12px; min-width: 52px; }
  .pill { font-size: 13px; font-weight: 600; padding: 0 14px; }
  .pill.on { background: linear-gradient(135deg, var(--orange), #ff7a00); box-shadow: 0 4px 12px rgba(255, 140, 0, .35); }
  .pill.cs { background: var(--green); box-shadow: 0 4px 12px rgba(34, 197, 94, .35); }
  .bar {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 0;
    background: linear-gradient(90deg, var(--orange), #ffd166);
    opacity: 0; transition: width .4s ease, opacity .3s;
  }
  .bar.loading { opacity: 1; width: 80%; transition: width 6s cubic-bezier(.1, .7, .2, 1), opacity .2s; }
  .bar.done { opacity: 0; width: 100%; }
  @media (max-width: 1100px) { .brand span, .title { display: none; } }
</style>
</head>
<body>
  <div class="brand" id="home" title="Beranda">
    <img src="../assets/icon.png" alt="">
    <div><b>BHOBU RELOAD</b><span>Isi ulang, bayar tagihan semua bisa</span></div>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="back" title="Kembali (Alt+←)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="forward" title="Maju (Alt+→)"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="reload" title="Muat ulang (F5)"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button id="homeBtn" title="Beranda"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  </div>
  <div class="title" id="title"></div>
  <div class="group">
    <button id="zoomOut" title="Perkecil (Ctrl -)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="zoomReset" class="zoom" title="Ukuran normal (Ctrl 0)">100%</button>
    <button id="zoomIn" title="Perbesar (Ctrl +)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <button id="theme" class="pill" title="Nyalakan/matikan tema modern">Tema</button>
  <button id="cs" class="pill cs" title="Hubungi CS lewat WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>CS
  </button>
  <div class="bar" id="bar"></div>
  <script src="toolbar.js"></script>
</body>
</html>
