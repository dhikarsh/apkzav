<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #eaf2ff, #f7f9fc);
  }
  .card {
    width: min(440px, 90vw); padding: 36px 32px; border-radius: 24px; background: #fff; text-align: center;
    box-shadow: 0 20px 50px rgba(10, 42, 110, .15);
  }
  .icon {
    width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
    background: #fff4e5; color: #ff8a00;
  }
  h1 { margin: 0 0 8px; font-size: 22px; color: #0a2a6e; }
  p { margin: 0 0 24px; color: #5b6b86; line-height: 1.5; }
  small { display: block; margin-top: 16px; color: #9aa7bd; }
  a {
    display: inline-block; padding: 12px 28px; border-radius: 14px; text-decoration: none; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, #1e6fe8, #0a49c2); box-shadow: 0 8px 20px rgba(30, 111, 232, .35);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>Tidak bisa terhubung</h1>
    <p>Periksa koneksi internet PC ini, lalu coba lagi.</p>
    <a id="retry" href="https://bhobureload.otoreport.com/">Coba lagi</a>
    <small id="desc"></small>
  </div>
  <script src="error.js"></script>
</body>
</html>
